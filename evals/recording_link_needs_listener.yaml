name: a recording link request without a listener is rejected before any upstream call
server:
  command: node
  args: [dist/entry.js]
  env:
    DUBBER_CLIENT_ID: eval-client-id-not-real
    DUBBER_CLIENT_SECRET: eval-client-secret-not-real
    DUBBER_AUTH_ID: eval-auth-id-not-real
    DUBBER_AUTH_TOKEN: eval-auth-token-not-real
assert:
  tool: dubber_recordings_get_link
  args:
    recordingId: "rec-1"
    contentDisposition: "inline"
  expect:
    is_error: true
    contains: ["listener"]
timeout: 30s
